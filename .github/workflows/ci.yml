name: ci
on: [push, pull_request]
permissions: { contents: read }
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: php -l on every PHP file (third-party PHPMailer excluded)
        run: |
          docker run --rm -v "$PWD":/app -w /app php:8.3-cli sh -c \
            'find . -name "*.php" -not -path "./email/phpmailer/*" -print0 | xargs -0 -n1 php -l >/dev/null'
      - name: compose files are valid
        run: |
          docker compose config -q
          DB_PASSWORD=x SMTP_HOST=smtp ADMIN_EMAIL=a@b.c ADMIN_PASSWORD=x \
            docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q
  smoke:
    runs-on: ubuntu-latest
    env: { DEMO: "true", APP_PORT: "8080" }
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build
      - name: wait for the app to be healthy
        run: |
          for i in $(seq 1 40); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q app)")" = healthy ] && exit 0
            sleep 3
          done
          docker compose logs; exit 1
      - run: BASE_URL=http://localhost:8080 tests/smoke.sh
      - if: failure()
        run: docker compose logs --no-color | tail -100
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
