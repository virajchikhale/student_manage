ServerTokens Prod
ServerSignature Off

# Server-side only code and files that must never be served
<DirectoryMatch "/var/www/html/(email|database|docker)(/|$)">
    Require all denied
</DirectoryMatch>
<FilesMatch "(^\.|\.(sql|md|sh|bak|ini|dist)$|^Dockerfile$|^docker-compose\.yml$)">
    Require all denied
</FilesMatch>
