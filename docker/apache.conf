ServerTokens Prod
ServerSignature Off

# Server-side only code and files that must never be served
<DirectoryMatch "/var/www/html/(email|database|docker)(/|$)">
    Require all denied
</DirectoryMatch>
<FilesMatch "(^\.|\.(sql|md|sh|bak|ini|dist|ya?ml)$|^Dockerfile$|^LICENSE$)">
    Require all denied
</FilesMatch>

# No directory listings
<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride None
</Directory>

# Security headers on every response (the pages use inline scripts/styles, hence 'unsafe-inline';
# Nunito comes from Google Fonts on the login pages).
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "DENY"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
